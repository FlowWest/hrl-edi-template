name: Check Required Files and Folders

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required folders and files
        run: |
          echo "Checking for required folders and files..."

          # Define required folders
          REQUIRED_FOLDERS=(
            "data/clean"
            "data/raw"
            "clean"
            "ingest"
            "qc"
            "publish/eml"
            "publish/metadata"
            "publish/metadata/attributes"
            "publish/metadata/personnel"
          )

          # Define required files
          REQUIRED_FILES=(
            "publish/metadata/abstract.txt"
            "publish/metadata/intellectual_rights.txt"
            "publish/metadata/keywords.txt"
            "publish/metadata/methods.docx"
            "publish/metadata/taxonomic_coverage.txt"
            "publish/metadata/geographic_coverage.txt"
            "publish/metadata/personnel.txt"
          )

          # Initialize error flag
          ERRORS=0

          # Check folders
          echo ""
          echo "=== Checking Folders ==="
          for folder in "${REQUIRED_FOLDERS[@]}"; do
            if [ -d "$folder" ]; then
              echo "✓ Found: $folder"
            else
              echo "✗ Missing: $folder"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # Check files
          echo ""
          echo "=== Checking Files ==="
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ Found: $file"
            else
              echo "✗ Missing: $file"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # Check that all files in data/ are .csv
          echo ""
          echo "=== Checking Data File Types ==="
          NON_CSV_FILES=$(find data/clean/ -type f ! -name "*.csv" ! -name ".gitkeep" 2>/dev/null)
          if [ -z "$NON_CSV_FILES" ]; then
            echo "✓ All files in data/clean/ are .csv"
          else
            echo "✗ Non-CSV files found in data/clean/:"
            echo "$NON_CSV_FILES" | while read -r f; do
              echo "  - $f"
            done
            ERRORS=$((ERRORS + $(echo "$NON_CSV_FILES" | wc -l)))
          fi

          # Check that all CSV files in data/clean/ are valid UTF-8
          echo ""
          echo "=== Checking CSV Encoding ==="
          CSV_FILES=$(find data/clean/ -type f -name "*.csv" 2>/dev/null)
          if [ -z "$CSV_FILES" ]; then
            echo "⚠ No CSV files found in data/clean/ to check"
          else
            while IFS= read -r csv; do
              ENCODING=$(file --mime-encoding -b "$csv")
              if [ "$ENCODING" = "utf-8" ] || [ "$ENCODING" = "us-ascii" ]; then
                echo "✓ $csv ($ENCODING)"
              else
                echo "✗ $csv has encoding: $ENCODING (expected utf-8)"
                ERRORS=$((ERRORS + 1))
              fi
            done <<< "$CSV_FILES"
          fi

          # Report results
          echo ""
          if [ $ERRORS -eq 0 ]; then
            echo "✓ All required folders and files are present!"
            exit 0
          else
            echo "✗ $ERRORS required folder(s) or file(s) are missing!"
            exit 1
          fi
